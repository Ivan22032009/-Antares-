version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "Ivan0680790898@"
      MYSQL_DATABASE: "admin_panel_db"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MYSQL_HOST=db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=Ivan0680790898@
      - MYSQL_DATABASE=admin_panel_db
      - DB_HOST=db
      - DB_USER=root
      - DB_NAME=admin_panel_db
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5002/api
    depends_on:
      - backend
    working_dir: /app

volumes:
  db_data:
